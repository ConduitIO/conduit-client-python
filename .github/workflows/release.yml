name: release

# Release to PyPI via Trusted Publishing (GitHub OIDC), no API token.
#
# The PyPI pending publisher was configured by DeVaris on 2026-08-03
# (project `conduit-client`, owner ConduitIO, repo conduit-client-python,
# workflow release.yml, no environment), so the OIDC exchange below now has a
# counterpart to match against.
#
# NOTE ON THE DISTRIBUTION NAME: README.md "Open questions for DeVaris" #1
# lists the name as unsettled (`conduit-client` vs `conduit-embed` vs bare
# `conduit`). Configuring a pending publisher does NOT claim the name -- the
# FIRST PUBLISH does, permanently, since PyPI does not free or reuse names.
# Settle #1 before the first tag push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Required for Trusted Publishing: lets the job mint the OIDC token PyPI
      # verifies instead of a long-lived API token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv build
      - run: uv run --with twine twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # Only on a tag push -- workflow_dispatch runs build+check only, so the
        # workflow stays usable as a dry run without risking a publish.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
